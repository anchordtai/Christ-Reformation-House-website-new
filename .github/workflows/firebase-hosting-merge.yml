# Retain the existing Firebase publishing branch. Main deploys through Vercel.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - y
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check optional Firebase configuration
        id: firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHRISTS_REFORMATION_HOUSE }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Firebase publishing skipped: service-account secret is not configured. Build validation still runs; production uses Vercel."
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.firebase.outputs.configured == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHRISTS_REFORMATION_HOUSE }}
          channelId: live
          projectId: christs-reformation-house
