# Retain the existing Firebase publishing branch. Main deploys through Vercel.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - y
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHRISTS_REFORMATION_HOUSE }}
          channelId: live
          projectId: christs-reformation-house
